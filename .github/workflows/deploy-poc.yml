# 把顧客端網頁自動發布到 GitHub Pages（免費、自動 HTTPS），方便用手機實機測試。
# 使用方式見 README.md「用手機測試」。
name: Deploy POC to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/customer/package-lock.json
      - run: npm ci
        working-directory: frontend/customer
      - run: npm run build
        working-directory: frontend/customer
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/customer/dist
      - id: deployment
        uses: actions/deploy-pages@v4
